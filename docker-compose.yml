services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    container_name: s3portal-postgres
    environment:
      POSTGRES_USER: s3portal
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: s3portal
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s3portal -d s3portal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - s3portal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Use 'development' target for dev, 'production' for prod
      target: ${BUILD_TARGET:-development}
    container_name: s3portal-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://s3portal:${DB_PASSWORD:-changeme}@postgres:5432/s3portal?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "3000:3000"
    volumes:
      # Mount for development hot-reload (only used in dev target)
      - .:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - s3portal
    # Run migrations before starting app
    command: >
      sh -c "npx prisma migrate deploy --skip-generate && 
             if [ \"$NODE_ENV\" = \"production\" ]; then 
               exec node server.js; 
             else 
               exec npm run dev; 
             fi"

networks:
  s3portal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
